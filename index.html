<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>bootstrap-imgdrop</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="./bootstrap-imgdrop.css"> 

        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <section class="container py-4">
            <div class="card">
                <div class="card-body">
                    <div class="card-title">Select Files</div>

                    <form data-bs-imgdrop="form" enctype="multipart/form-data" action="">
                        <section class="upload-zone" data-bs-imgdrop="dropZone">
                            <div class="d-flex flex-wrap justify-content-center align-items-center gap-2 text-secondary">
                                <i class="bi bi-file-earmark-image fs-5"></i>
                                <span>Arraste e solte suas imagens aqui ou</span>
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-imgdrop="selectBtn">Selecione as imagens</button>
                            </div>
                            <small class="text-secondary" data-bs-imgdrop="hint"></small>
                            <input type="file" data-bs-imgdrop="fileInput" name="images[]" accept="image/*" multiple style="display:none">

                            <div class="mt-1">
                                <small class="text-danger" data-bs-imgdrop="errMsg" role="alert"></small>
                                <div data-bs-imgdrop="imgGrid" class="img-grid mb-2"></div>
                                <small class="text-secondary" data-bs-imgdrop="counter" style="display:none">
                                    <span data-bs-imgdrop="countNum">0</span>/3
                                </small>
                            </div>
                        </section>

                        <button type="submit" class="btn btn-primary mt-3">Submit</button>
                    </form> 
                </div>
            </div>
        </section>

        <script src="./bootstrap-imgdrop.js"></script>

        <script>
            $('[data-bs-imgdrop="form"]').imgDrop({

                max:        3,
                maxSize:    10485760, // 10 MB
                extensions: ["jpg", "jpeg", "png", "svg", "heic"],

                messages: {
                    limitReached:  (max)          => `Você só pode enviar ${max} fotos.`,
                    limitExceeded: (slots)        => `Só são permitidas ${slots} imagens.`,
                    invalidExt:    (name, exts)   => `${name} inválido. Use: ${exts}`,
                    sizeExceeded:  (name, mb)     => `${name} é grande demais (máx ${mb} MB).`,
                    noneSelected:  ()             => "Selecione ao menos uma imagem.",
                    uploadError:   ()             => "Falha no envio.",
                    tooltipRemove: ()             => "Remover imagem",
                    hint: (exts, mb, max)         => `${exts.join(", ").toUpperCase()} · max ${mb} MB por Arquivo · até ${max} imagens`,
                },

                mock: true, // true para testar sem backend

                onUploadSuccess: (response) => console.log("OK:", response),
                onUploadError:   (xhr)      => console.error("Falha:", xhr),
            });        
        </script>
    </body>
</html>
